<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LG VS + 경쟁사 브리핑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e6e9ee; --sheet:#f5f7fa; --ink:#1c1c1e; --muted:#6d6b66; --rule:#1c1c1e; --hair:#cdd2da;
  --lg:#a50034; --lg-soft:#f6dfe6;
  --blue:#2f6fde; --purple:#7b4fe0; --green:#16935f; --orange:#e5761b; --red:#d43d3d; --gray:#6b6b6b;
  --memo:#fff3a6; --memo-ink:#3a3420;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#17171a; --sheet:#1f1f23; --ink:#ecebe6; --muted:#a3a19b; --rule:#ecebe6; --hair:#3a3a40;
  --lg:#ff5c8a; --lg-soft:#3b1d27; --memo:#4a4320; --memo-ink:#fff3c4;
}}
:root[data-theme="dark"]{
  --paper:#17171a; --sheet:#1f1f23; --ink:#ecebe6; --muted:#a3a19b; --rule:#ecebe6; --hair:#3a3a40;
  --lg:#ff5c8a; --lg-soft:#3b1d27; --memo:#4a4320; --memo-ink:#fff3c4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans)}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 72px}

/* ---------- masthead ---------- */
.mast{text-align:center;padding:6px 0 0}
.mast .top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.04em;border-bottom:1px solid var(--rule);padding-bottom:6px}
.mast .name{font-family:var(--serif);font-weight:900;font-size:clamp(30px,8.4vw,62px);line-height:1.1;letter-spacing:-.03em;margin:14px 0 8px;word-break:keep-all}
.mast .name .vs{color:var(--lg)}
.mast .kicker{font-size:14px;color:var(--muted);margin-bottom:10px;word-break:keep-all}
.mast .top span{white-space:nowrap}
@media (max-width:480px){.mast .top{flex-wrap:wrap;justify-content:center;font-size:11px;gap:2px 10px}}
.dateline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;border-top:3px double var(--rule);border-bottom:3px double var(--rule);padding:7px 2px;font-size:14px;font-weight:600}
.dateline select{font:inherit;font-size:14px;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);border-radius:999px;padding:3px 10px;cursor:pointer}
.dateline .issue{font-family:var(--serif);font-weight:900}

/* ---------- lead story ---------- */
.lead{margin-top:20px;padding:4px 0 18px;border-bottom:1.5px solid var(--rule);position:relative}
.lead .label{display:inline-block;background:var(--lg);color:#fff;font-weight:800;font-size:12px;letter-spacing:.06em;padding:3px 10px;border-radius:3px}
.lead h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,6.2vw,40px);line-height:1.25;margin:10px 0 6px;word-break:keep-all}
.lead .meta{font-size:13px;color:var(--muted)}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.count{display:inline-block;background:var(--sheet);border:1px solid var(--hair);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.count b{font-weight:800;color:var(--lg)}

/* ---------- section heads ---------- */
.sh{display:flex;align-items:center;gap:10px;margin:34px 0 12px}
.sh h2{font-family:var(--serif);font-weight:900;font-size:22px;margin:0;white-space:nowrap}
.sh .bar{flex:1;height:0;border-top:1.5px solid var(--rule)}

/* ---------- 한눈에 (key points) ---------- */
.points{display:grid;grid-template-columns:1fr;gap:12px;counter-reset:p}
@media (min-width:680px){.points{grid-template-columns:1fr 1fr}}
.point{counter-increment:p;background:var(--sheet);border:1px solid var(--hair);border-radius:14px;padding:14px 16px 14px 64px;position:relative;min-height:72px;word-break:keep-all}
.point::before{content:counter(p);position:absolute;left:14px;top:12px;width:38px;height:38px;border-radius:12px;background:var(--lg);color:#fff;font-family:var(--serif);font-weight:900;font-size:22px;display:grid;place-items:center}
.point:nth-child(2)::before{background:var(--blue)}
.point:nth-child(3)::before{background:var(--green)}
.point:nth-child(4)::before{background:var(--orange)}
.point:nth-child(5)::before{background:var(--purple)}

/* ---------- topic stories ---------- */
.topic{margin-top:14px;background:var(--sheet);border:1px solid var(--hair);border-top:5px solid var(--c);border-radius:4px 4px 14px 14px;padding:4px 18px 8px}
.topic .tag{display:inline-flex;align-items:center;gap:6px;margin:12px 0 2px;font-weight:800;font-size:13px;letter-spacing:.04em;color:var(--c)}
.topic .tag small{font-weight:500;color:var(--muted);font-size:12px}
.story{padding:14px 0;border-top:1px dashed var(--hair)}
.story:first-of-type{border-top:0}
.thumb{width:64px;height:64px;border-radius:16px;background:var(--c);display:grid;place-items:center;font-size:30px;position:relative;overflow:hidden}
.thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),transparent 55%)}
.story h3{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.35;margin:0 0 4px;word-break:keep-all}
.story p{margin:0 0 8px;color:var(--ink);opacity:.92}
.srcs{display:flex;flex-wrap:wrap;gap:6px}
.srcs a{font-size:12px;font-weight:600;text-decoration:none;border:1px solid var(--hair);background:var(--paper);border-radius:999px;padding:2px 9px}
.srcs a:hover{border-color:var(--c);color:var(--c)}

/* ---------- competitor radar ---------- */
.radar{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:680px){.radar{grid-template-columns:1fr 1fr}}
.rc{background:var(--sheet);border:1.5px solid var(--hair);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.rc.high{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 14%,transparent)}
.rc .who{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;letter-spacing:-.02em;flex:none}
.rc .co{font-weight:800;font-size:16px;line-height:1.2}
.rc .when{font-size:12px;color:var(--muted)}
.meter{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.meter .bars{display:flex;gap:3px;align-items:flex-end}
.meter .bars span{width:7px;border-radius:2px;background:var(--hair)}
.meter .bars span:nth-child(1){height:9px}.meter .bars span:nth-child(2){height:14px}.meter .bars span:nth-child(3){height:19px}
.meter.low .bars span:nth-child(-n+1){background:var(--gray)}
.meter.mid .bars span:nth-child(-n+2){background:var(--orange)}
.meter.high .bars span{background:var(--red)}
.meter b{font-size:11px;font-weight:800}
.meter.low b{color:var(--gray)}.meter.mid b{color:var(--orange)}.meter.high b{color:var(--red)}
.rc h3{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.35;margin:4px 0 0;word-break:keep-all}
.rc h3 a{text-decoration:none}.rc h3 a:hover{text-decoration:underline}
.rc p{margin:0;font-size:15px}
.rc .why{background:var(--lg-soft);border-radius:10px;padding:8px 10px;font-size:14px}
.rc .why b{color:var(--lg)}
.note{font-size:13px;color:var(--muted);margin:10px 2px 0}

/* ---------- memo (watch) ---------- */
.memo{position:relative;background:var(--memo);color:var(--memo-ink);padding:22px 20px 16px;margin:30px 6px 0;transform:rotate(-.6deg);box-shadow:0 10px 18px -12px rgba(0,0,0,.45)}
.memo::before{content:"";position:absolute;top:-11px;left:50%;width:120px;height:22px;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.08)}
.memo h2{font-family:var(--serif);font-weight:900;font-size:20px;margin:0 0 8px}
.memo ul{margin:0;padding:0;list-style:none}
.memo li{padding:5px 0 5px 28px;position:relative;word-break:keep-all}
.memo li::before{content:"✔";position:absolute;left:4px;top:5px;font-weight:900;color:var(--lg)}

/* ---------- article index ---------- */
.idx{background:var(--sheet);border:1px solid var(--hair);border-radius:14px;padding:4px 16px}
.idx a.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--hair);text-decoration:none}
.idx a.row:first-child{border-top:0}
.idx .n{font-family:var(--serif);font-weight:900;color:var(--muted);min-width:20px}
.idx .t{font-weight:600;line-height:1.4}
.idx a.row:hover .t{text-decoration:underline}
.idx .s{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.idx .s em{display:block;font-style:normal}

.empty{background:var(--sheet);border:1px dashed var(--hair);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
footer{margin-top:40px;padding-top:10px;border-top:3px double var(--rule);font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="top"><span>LG ELECTRONICS · VEHICLE SOLUTION</span><span>매일 오전 10시 발행</span></div>
    <div class="name">LG <span class="vs">VS</span> + 경쟁사 브리핑</div>
    <div class="kicker">LG전자 VS사업본부 · Bosch · AUMOVIO · HARMAN · 현대모비스</div>
    <div class="dateline">
      <span id="dateText">—</span>
      <span class="issue" id="issue"></span>
      <label>지난 호 <select id="dates" aria-label="날짜 선택"></select></label>
    </div>
  </header>
  <main id="main"><div class="empty" style="margin-top:18px">신문을 펼치는 중…</div></main>
  <footer>요약은 자동 생성되어 오류가 있을 수 있어요. 중요한 내용은 원문 링크에서 확인하세요.</footer>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "#";
const DOW = ["일","월","화","수","목","금","토"];
let DATES = [];

const TOPICS = [
  {k:"수주",   emoji:"🤝", color:"var(--blue)"},
  {k:"제품",   emoji:"📡", color:"var(--purple)"},
  {k:"실적",   emoji:"📈", color:"var(--green)"},
  {k:"파트너", emoji:"🎪", color:"var(--orange)"},
  {k:"시장",   emoji:"⚖️", color:"var(--red)"},
];
const topicStyle = t => TOPICS.find(x => (t||"").startsWith(x.k)) || {emoji:"📰", color:"var(--gray)"};
const STORY_EMOJI = [
  [/v2x|v2n|교통|안전|ecall|긴급/i, "🚦"], [/텔레매틱스|5g|통신|커넥티/i, "📶"], [/디스플레이|oled|화면/i, "🖥️"],
  [/sdv|소프트웨어|ota|업데이트/i, "💾"], [/수주|공급|계약|선정/i, "🤝"], [/실적|매출|영업이익|전망/i, "📈"],
  [/전시|총회|박람회|ces|모터쇼/i, "🎪"], [/선언|협력|파트너|mou/i, "🫱🏻‍🫲🏼"], [/인포테인먼트|콕핏/i, "🚗"],
];
const storyEmoji = (it, fallback) => (STORY_EMOJI.find(([re]) => re.test((it.title||"") + " " + (it.summary||""))) || [0, fallback])[1];

const LOGOS = [
  [/bosch/i, "BOSCH", "#e2001a"], [/aumovio|continental/i, "AU", "#ff7a00"],
  [/harman/i, "HAR", "#1d4f91"], [/모비스|mobis/i, "모비스", "#003d84"],
];
function logo(name){
  const m = LOGOS.find(([re]) => re.test(name||""));
  const txt = m ? m[1] : (name||"?").slice(0,3), bg = m ? m[2] : "#555";
  const fs = txt.length > 3 ? "11px" : "14px";
  return `<span class="logo" style="background:${bg};font-size:${fs}">${esc(txt)}</span>`;
}
const LV = {high:["높음","high"], mid:["중간","mid"], low:["낮음","low"]};

function prettyDate(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s||""); if(!m) return s || "";
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return `${m[1]}년 ${+m[2]}월 ${+m[3]}일 ${DOW[d.getDay()]}요일`;
}

async function getJSON(path){
  const r = await fetch(path + "?v=" + Date.now());
  if(!r.ok) throw new Error(path + " " + r.status);
  return r.json();
}

function sectionHead(title){
  return `<div class="sh"><h2>${esc(title)}</h2><span class="bar"></span></div>`;
}

function render(rep){
  const arts = rep.articles || [], comps = rep.competitors || [];
  const byId = Object.fromEntries(arts.map(a => [a.id, a]));
  const highs = comps.filter(c => c.level === "high").length;
  $("#dateText").textContent = prettyDate(rep.date);
  const idx = DATES.indexOf(rep.date);
  $("#issue").textContent = idx >= 0 ? `제 ${DATES.length - idx}호` : "";

  let h = `<section class="lead"><span class="label">오늘의 1면</span>`
    + `<h1>${esc(rep.headline || "LG전자 VS(전장) 뉴스 브리핑")}</h1>`
    + `<div class="counts">`
    + `<span class="count">LG VS 기사 <b>${arts.length}</b>건</span>`
    + `<span class="count">주제 <b>${(rep.sections||[]).filter(s => s.items?.length).length}</b>개</span>`
    + (comps.length ? `<span class="count">경쟁사 견제 높음 <b>${highs}</b>건</span>` : "")
    + `</div></section>`;

  if (rep.key_points?.length){
    h += sectionHead("한눈에 보기")
      + `<div class="points">${rep.key_points.map(p => `<div class="point">${esc(p)}</div>`).join("")}</div>`;
  }

  const secs = (rep.sections||[]).filter(s => s.items?.length);
  if (secs.length){
    h += sectionHead("오늘의 기사");
    for (const sec of secs){
      const st = topicStyle(sec.topic);
      const [main, sub] = (sec.topic||"기타").split(/[(（]/);
      h += `<section class="topic" style="--c:${st.color}"><div class="tag">${esc(main.trim())}${sub ? ` <small>${esc(sub.replace(/[)）]$/,""))}</small>` : ""}</div>`;
      for (const it of sec.items){
        const links = (it.article_ids||[]).map(i => byId[i]).filter(Boolean)
          .map(a => `<a href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener">${esc(a.source)}</a>`).join("");
        h += `<article class="story"><div>`
          + `<h3>${esc(it.title)}</h3><p>${esc(it.summary)}</p>${links ? `<div class="srcs">${links}</div>` : ""}</div></article>`;
      }
      h += `</section>`;
    }
  } else if (!arts.length) {
    h += sectionHead("오늘의 기사") + `<div class="empty">오늘은 새 VS 기사가 없어요. 경쟁사 소식을 확인해 보세요.</div>`;
  }

  if (comps.length){
    h += sectionHead("경쟁사 레이더")
      + `<div class="radar">${comps.map(c => {
        const [lvText, lv] = LV[c.level] || LV.mid;
        return `<div class="rc ${lv}">`
          + `<div class="who">${logo(c.company)}<div><div class="co">${esc(c.company)}</div><div class="when">${esc(c.date||"")}${c.source ? " · " + esc(c.source) : ""}</div></div>`
          + `<div class="meter ${lv}" title="견제도 ${lvText}"><div class="bars"><span></span><span></span><span></span></div><b>견제 ${lvText}</b></div></div>`
          + `<h3><a href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener">${esc(c.title)}</a></h3>`
          + `<p>${esc(c.summary)}</p>`
          + (c.why ? `<div class="why"><b>LG VS 관점 ·</b> ${esc(c.why)}</div>` : "")
          + `</div>`;
      }).join("")}</div>`
      + (rep.competitors_note ? `<p class="note">${esc(rep.competitors_note)}</p>` : "");
  }

  if (rep.watch?.length){
    h += `<aside class="memo"><h2>영업 메모</h2><ul>${rep.watch.map(w => `<li>${esc(w)}</li>`).join("")}</ul></aside>`;
  }

  if (arts.length){
    h += sectionHead("원문 기사")
      + `<div class="idx">${arts.map((a,i) => `<a class="row" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener"><span class="n">${i+1}</span><span class="t">${esc(a.title)}</span><span class="s"><em>${esc(a.source)}</em>${esc(a.published||"")}</span></a>`).join("")}</div>`;
  }
  $("#main").innerHTML = h;
}

async function load(date){
  try { render(await getJSON(`reports/${date}.json`)); history.replaceState(null, "", "#" + date); window.scrollTo(0,0); }
  catch(e){ $("#main").innerHTML = `<div class="empty" style="margin-top:18px">${esc(date)} 호를 불러오지 못했어요.</div>`; }
}

(async () => {
  try { DATES = (await getJSON("reports/index.json")).dates || []; } catch(e) {}
  if (!DATES.length){
    $("#main").innerHTML = `<div class="empty" style="margin-top:18px">첫 호는 다음 오전 10시 전후에 발행돼요.</div>`;
    $("#dates").parentElement.style.display = "none";
    return;
  }
  $("#dates").innerHTML = DATES.map((d,i) => `<option value="${esc(d)}">${esc(d)} · 제 ${DATES.length - i}호</option>`).join("");
  const want = decodeURIComponent(location.hash.slice(1));
  const start = DATES.includes(want) ? want : DATES[0];
  $("#dates").value = start;
  $("#dates").onchange = e => load(e.target.value);
  load(start);
})();
</script>
</body>
</html>
